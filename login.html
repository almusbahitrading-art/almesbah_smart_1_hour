<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تسجيل الدخول - المصباح الذكي</title>
<style>
    body {
        margin: 0;
        font-family: "Cairo", sans-serif;
        background: linear-gradient(135deg, #000, #1a1a1a);
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow-x: hidden;
    }

    .login-container {
        background: rgba(20,20,20,0.9);
        border: 1px solid #444;
        border-radius: 15px;
        width: 350px;
        max-width: 90%;
        padding: 30px;
        box-shadow: 0 0 25px #ffd86b;
        text-align: center;
        position: relative;
    }

    /* مصباح صغير كشعار أعلى */
    .lamp-logo {
        width: 60px;
        height: 30px;
        margin: 0 auto 20px;
        background: linear-gradient(90deg, #b88b34, #ffd87d);
        border-radius: 30px 30px 10px 10px;
        box-shadow: 0 0 15px #ffdf91;
        position: relative;
    }
    .lamp-logo::before {
        content: '';
        width: 20px;
        height: 12px;
        background: #d4a447;
        border-radius: 8px 8px 50% 50%;
        position: absolute;
        right: -25px;
        top: 6px;
        box-shadow: 0 0 10px #d4a447;
    }

    h2 {
        margin: 0 0 20px;
        font-size: 24px;
        color: #ffd86b;
        text-shadow: 0 0 8px #ffc850;
    }

    input[type="text"], input[type="email"], input[type="password"] {
        width: 90%;
        padding: 12px;
        margin: 10px 0;
        border-radius: 8px;
        border: none;
        outline: none;
        font-size: 16px;
    }

    .btn {
        width: 95%;
        padding: 12px;
        margin: 15px 0;
        border: none;
        border-radius: 8px;
        background: linear-gradient(90deg, #ffd86b, #b88b34);
        color: #111;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 0 15px #ffd86b;
        transition: 0.3s;
    }
    .btn:hover {
        background: linear-gradient(90deg, #b88b34, #ffd86b);
        box-shadow: 0 0 25px #ffd86b;
    }

    .small-text {
        font-size: 14px;
        color: #ccc;
        margin-top: 10px;
    }

    .subscribe {
        margin-top: 15px;
        font-size: 16px;
        color: #ffd86b;
        cursor: pointer;
        text-decoration: underline;
    }

    /* Responsive */
    @media (max-width: 400px) {
        .login-container { width: 90%; padding: 20px; }
        h2 { font-size: 20px; }
        input[type="text"], input[type="email"], input[type="password"], .btn { font-size: 14px; padding: 10px; }
    }
</style>
</head>
<body>

<div class="login-container">
    <div class="lamp-logo"></div>
    <h2>تسجيل الدخول</h2>

    <form onsubmit="window.location.href='almesbah.html'; return false;">
        <input type="email" placeholder="البريد الإلكتروني" required>
        <input type="password" placeholder="كلمة المرور" required>
        <button type="submit" class="btn">دخول</button>
    </form>

    <div class="small-text">
        ليس لديك حساب؟ 
        <span class="subscribe" onclick="showSubscribe()">اشترك الآن</span>
    </div>
</div>

<script>
function showSubscribe() {
    alert("يمكنك إضافة نموذج الاشتراك هنا مع دمج بوابة الدفع.");
}
</script>

</body>
